<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Food Ninja</title>
  <!-- materialize icons, css & js -->
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>
</head>
<body class="grey lighten-4">

  <!-- Menu superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">FOODNINJA</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- Menu lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">UberEatsCUDEC</a></li>

    <li><a href="/" class="waves-effect">Inicio</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">Pedidos</a></li>

    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contacto</a></li>
  </ul>

  <!-- content -->
  <div class="container grey-text">
    <h5 class="Left">Platillos</h5>

    <div class="recipes container grey-text text-darken-1">
      <label for="platillos">Selecciona un platillo:</label>
      <select id="listaPlatillos" name="platillos" class="browser-default">
      </select>
    </div>

    <h5 class="Left">Direccion</h5>
    <input placeholder="Direccion" id="title" type="text" class="validate">
    <h5 class="Left">usuario</h5>
    <input placeholder="usuario" id="usuario" type="text" class="validate">

    <div class="input-field center">
      <button id="btnCancelar" class="btn-small red">Cancelar</button>
      <button id="btnGuardar" class="btn-small">Guardar</button>
      <button id="btnUbicacion" class="btn-small">Ubicación</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="/js/firebase.js"></script>
  <script src="/js/pedidos.js"></script>

</body>
</html>
