<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Food Ninja - Pedidos</title>
  <!-- materialize icons, css & js -->
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>
</head>
<body class="grey lighten-4">

  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">Food<span>Ninja</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">FOODNINJA</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/about.html" class="waves-effect">About</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contact</a>
    </li>
  </ul>

  <!-- content -->
  <div class="container grey-text">
    <form id="form-pedido" style="margin-top: 30px;">
      
      <!-- Select: Platillo -->
      <div class="input-field">
        <select id="platillo" name="platillo">
          <option value="" disabled selected>Selecciona un platillo</option>
          <option value="1">Opción 1</option>
          <option value="2">Opción 2</option>
          <option value="3">Opción 3</option>
        </select>
        <label for="platillo">Platillo</label>
      </div>

    
      <div class="input-field">
        <textarea id="direccion" name="direccion" class="materialize-textarea"></textarea>
        <label for="direccion">Dirección</label>
      </div>

    
      <div class="center-align" style="margin-top: 20px;">
        <button type="button" id="btnCancelar" class="btn-flat waves-effect grey-text">Cancelar</button>
        <button type="submit" id="btnguardar" class="btn waves-effect waves-light orange darken-3">Guardar</button>
      </div>

    </form>
  </div>

  <script src="/js/ui.js"></script>
  
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Obligatorio para que Materialize muestre el menú desplegable (Select)
      var selects = document.querySelectorAll('select');
      M.FormSelect.init(selects);
      
      
      var sidenavs = document.querySelectorAll('.sidenav');
      M.Sidenav.init(sidenavs);
    });
  </script>
</body>
</html>
